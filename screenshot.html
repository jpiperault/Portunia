            const outs = { s1: [0, 'uptime: 14:02 up 14 days, load 0.42\n/dev/sda2  40G  18G  20G  48% /'], s2: [0, 'uptime: 14:02 up 3 days, load 1.10\n/dev/sda2  40G  31G  7G  82% /'], s3: [1, '', 'df: /data: No such file or directory'] };
            args.sessionIds.forEach((sid, i) => setTimeout(() => {
              const o = outs[sid];
              send(id, o ? { type: 'result', sessionId: sid, status: o[0], stdout: o[1], stderr: o[2] || '', ms: 400 + i * 230 } : { type: 'failed', sessionId: sid, error: 'Pas de réponse de 10.0.2.40:22 (délai dépassé)', ms: 15000 });
            }, 300 + i * 250));
            setTimeout(() => send(id, { type: 'done', ok: 2, failed: args.sessionIds.length - 2 }), 400 + args.sessionIds.length * 250);
            return 'job';
          }
          case 'server_stats': {
            const t = Date.now() / 1000;
            return { os: 'Debian GNU/Linux 13 (trixie)', kernel: '6.12.48-amd64', hostname: 'srv-web-01', uptimeSecs: 51322 + Math.round(t % 1000), load: [0.42, 0.31, 0.25], cpus: 4,
              cpuPercent: 18 + 12 * Math.sin(t / 3), memTotalKb: 8042512, memAvailableKb: 2620000, swapTotalKb: 2097148, swapFreeKb: 1900000,
              disks: [{ mount: '/', fs: 'ext4', totalKb: 41152736, usedKb: 18245600 }, { mount: '/var/lib/mysql', fs: 'xfs', totalKb: 104857600, usedKb: 96000000 }],
              processes: [{ pid: 1184, cpu: 12.5, mem: 1.2, name: 'nginx' }, { pid: 901, cpu: 6.1, mem: 4.8, name: 'php-fpm8.4' }, { pid: 733, cpu: 3.4, mem: 22.6, name: 'mariadbd' }, { pid: 1, cpu: 0.1, mem: 0.2, name: 'systemd' }],
              failedServices: ['backup-nightly.service'] };
          }
          case 'credentials_list': return [
            { id: 'c1', name: T('Production admin', 'Admin production'), username: 'admin', auth: 'key', keyPath: '', domain: '', secretKeys: ['passphrase'], usedBy: ['srv-web-01', 'srv-web-02', 'srv-db-01'] },
            { id: 'c2', name: T('Domain account', 'Compte domaine'), username: 'jpiperault', auth: 'password', keyPath: '', domain: 'CORP', secretKeys: ['password'], usedBy: [] },
          ];
          case 'field_suggestions': return args.source === 'credentials' ? [{ value: T('Production admin', 'Admin production'), label: 'admin' }, { value: T('Domain account', 'Compte domaine'), label: 'jpiperault' }] : [];
          case 'shells_detect': return [
            { id: 'pwsh', name: 'PowerShell 7', command: 'pwsh.exe', args: ['-NoLogo'], cwd: '', icon: 'pwsh' },
            { id: 'cmd', name: T('Command Prompt', 'Invite de commandes'), command: 'cmd.exe', args: [], cwd: '', icon: 'cmd' },
            { id: 'wsl:Ubuntu', name: 'Ubuntu (WSL)', command: 'wsl.exe', args: ['-d', 'Ubuntu'], cwd: '', icon: 'wsl' },
          ];
          case 'notes_list': return ['s1'];
          case 'note_get': return args.sessionId === 's1' ? T('# srv-web-01\nProduction **nginx** server.\n\n- [x] Certificate renewed\n- [ ] Move to PHP 8.4\n\n```\nsudo systemctl reload nginx\n```\nContact: https://wiki.local/web', '# srv-web-01\nServeur **nginx** de production.\n\n- [x] Certificat renouvelé\n- [ ] Passer en PHP 8.4\n\n```\nsudo systemctl reload nginx\n```\nContact : https://wiki.local/web') : '';
          case 'note_set': return null;
          case 'ssh_keys_list': return [{ name: 'id_ed25519', path: 'C:\Users\julien\.ssh\id_ed25519', algorithm: 'Ed25519', fingerprint: 'SHA256:q8m5Yc0f3nV6l0yQx2rE4c1q9u2y8H7Kf0dXo3P1aZ4', comment: 'julien@pc-julien', public: 'ssh-ed25519 AAAA julien@pc-julien', encrypted: true }];
          case 'ssh_key_default_comment': return 'julien@pc-julien';
          case 'net_resolve': return ['10.0.1.12', 'fd00::12'];
          case 'net_cancel': return null;
          case 'net_wake': return '255.255.255.255';
          case 'net_ping': {
            const id = chId(args.onEvent);
            send(id, { type: 'start', ip: '10.0.1.12' });
            [12, 9, null, 11].forEach((rtt, i) => setTimeout(() => send(id, { type: 'ping', seq: i + 1, echo: rtt === null ? { kind: 'timeout' } : { kind: 'reply', from: '10.0.1.12', rtt, ttl: 63 } }), 150 * (i + 1)));
            setTimeout(() => send(id, { type: 'done', message: '4 envoyés, 3 reçus, 25 % de perte · min 9 ms, moy 10 ms, max 12 ms' }), 800);
            return 'job';
          }
          case 'net_traceroute': {
            const id = chId(args.onEvent);
            send(id, { type: 'start', ip: '10.0.1.12' });
            [['192.168.1.1', [1, 1, 2]], ['', [null, null, null]], ['10.0.0.1', [8, 7, 9]], ['10.0.1.12', [11, 10, 12]]].forEach(([from, rtts], i) => setTimeout(() => send(id, { type: 'hop', hop: i + 1, from, rtts }), 150 * (i + 1)));
            setTimeout(() => send(id, { type: 'done', message: '10.0.1.12 atteint en 4 sauts' }), 800);
            return 'job';
          }
          case 'net_ports': {
            const id = chId(args.onEvent);
            send(id, { type: 'start', ip: '10.0.1.12' });
            [[22, 'open', 'SSH'], [80, 'open', 'HTTP'], [443, 'open', 'HTTPS'], [3389, 'filtered', 'RDP']].forEach(([port, st, service], i) => setTimeout(() => send(id, { type: 'port', port, state: st, ms: st === 'open' ? 6 + i : null, service }), 100 * (i + 1)));
            setTimeout(() => send(id, { type: 'done', message: '4 ports testés, 3 ouverts' }), 600);
            return 'job';
          }
          case 'pve_list': return [{ id: 'pve1', name: 'pve-lab', host: '192.168.1.5', port: 8006, fingerprint: '', user: 'root@pam', tokenId: 'portunia', hasSecret: true }];
          case 'pve_api': return pve(args.method, args.path, args.params);
          case 'pve_api_full': return { data: pve('GET', args.path), changes: /network$/.test(args.path) ? '--- /etc/network/interfaces\n+++ /etc/network/interfaces.new\n@@ -12,3 +12,7 @@\n+auto vmbr2\n+iface vmbr2 inet static\n+\taddress 10.0.20.11/24\n+\tbridge-ports eno3' : null };
          case 'plugin:event|listen': return next++;
          case 'plugin:notification|is_permission_granted': return true;
          case 'plugin:updater|check': return null;
          default: return ['gate_list', 'local_list', 'recordings_list', 'import_preview'].includes(cmd) ? [] : null;
        }
      }

      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: 'main' }, currentWebview: { label: 'main', windowLabel: 'main' } },
        transformCallback(cb) { const id = next++; callbacks[id] = cb; channels[id] = { index: 0 }; return id; },
        unregisterCallback(id) { delete callbacks[id]; },
        convertFileSrc: (p) => p,
        invoke: (cmd, args) => invoke(cmd, args),
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };

      // Mise en scène : ouvrir des sessions et des panneaux automatiquement (?scene=main|split|server|proxmox).
      window.addEventListener('load', () => {
        const later = (ms, f) => setTimeout(f, ms);
        const openByName = (name) => document.querySelector(`.tree-item.session[data-id="${sessions.find((x) => x.name === name)?.id}"]`)?.click();
        const clickTitle = (start) => [...document.querySelectorAll('button[title]')].find((b) => b.title.startsWith(start))?.click();
        const menuItem = (label) => [...document.querySelectorAll('.menu-item')].find((b) => b.textContent.includes(label))?.click();
        later(1500, () => {
          if (scene === 'proxmox') {
            document.getElementById('rail-proxmox')?.click();
            later(800, () => {
              const more = document.querySelector('#proxmox button[aria-label$="pve-lab"]');
              const r = more?.getBoundingClientRect();
              more?.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: r?.x, clientY: r?.y }));
              later(200, () => menuItem(T('Monitoring', 'Supervision')));
            });
            return;
          }
          openByName('srv-web-01');
          if (scene === 'main') later(800, () => clickTitle(T('File browser', 'Explorateur de fichiers')));
          if (scene === 'server') later(800, () => clickTitle(T('Dashboard:', 'Tableau de bord')));
          if (scene === 'split') {
            later(500, () => {
              openByName('srv-web-02');
              later(800, () => {
                clickTitle(T('Show several sessions side by side', 'Afficher plusieurs sessions côte à côte'));
                later(200, () => menuItem(T('Show beside: srv-web-01', 'Afficher à côté : srv-web-01')));
                later(600, () => clickTitle(T('File browser', 'Explorateur de fichiers')));
              });
            });
          }
        });
      });
    })();
  </script>
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Activités">
      <button id="rail-sessions" class="rail-btn" type="button"></button>
      <button id="rail-gates" class="rail-btn" type="button" hidden></button>
      <button id="rail-proxmox" class="rail-btn" type="button" hidden></button>
      <button id="rail-pc" class="rail-btn" type="button"></button>
      <span class="rail-sep" aria-hidden="true"></span>
      <button id="open-snippets" class="rail-btn" type="button"></button>
      <button id="open-credentials" class="rail-btn" type="button"></button>
      <button id="open-recordings" class="rail-btn" type="button"></button>
      <button id="open-assist" class="rail-btn" type="button" hidden></button>
      <button id="open-nettools" class="rail-btn" type="button"></button>
      <button id="open-import" class="rail-btn" type="button"></button>
      <span class="grow"></span>
      <button id="open-extensions" class="rail-btn" type="button"></button>
      <button id="open-settings" class="rail-btn" type="button"></button>
    </nav>
    <nav class="sidebar" aria-label="Sessions">
      <section id="pane-sessions" class="side-pane">
        <div class="side-pane-head">
          <span class="side-pane-title"><span id="title-sessions">Sessions</span> <span id="session-count" class="count"></span></span>
          <div class="head-actions">
            <button id="quick-connect" class="icon-btn" aria-label="Connexion rapide" title="Connexion rapide : adresse, identifiant et mot de passe (Ctrl Maj Q)"></button>
            <button id="new-folder" class="icon-btn" aria-label="Nouveau dossier" title="Nouveau dossier"></button>
            <button id="new-session" class="icon-btn" aria-label="Nouvelle session" title="Nouvelle session (Ctrl Maj N)"></button>
          </div>
        </div>
        <label class="search">
          <span class="sr-only">Filtrer les sessions</span>
          <input id="search" type="search" placeholder="Filtrer, ou ssh user@hôte…" title="Filtrer les sessions (Ctrl Maj K) ; ↓ pour parcourir, Entrée ouvre la première. « user@hôte », « rdp hôte »… : connexion rapide. Palette : Ctrl Maj O" autocomplete="off">
        </label>
        <div id="session-chips" class="filter-chips"></div>
        <div id="tree" class="tree"></div>
        <button id="open-library" class="library-link" type="button">Toutes les sessions en tableau</button>
      </section>
      <section id="pane-gates" class="side-pane" hidden>
        <div id="gates" class="gates" hidden></div>
      </section>
      <section id="pane-proxmox" class="side-pane" hidden>
        <div id="proxmox" class="gates" hidden></div>
      </section>
      <section id="pane-pc" class="side-pane" hidden>
        <div class="side-pane-head">
          <span id="title-pc" class="side-pane-title">Ce PC</span>
          <div class="head-actions">
            <button id="manage-shells" class="icon-btn" aria-label="Gérer les shells locaux" title="Gérer les shells locaux"></button>
          </div>
        </div>
        <div id="local-shells" class="local-shells"></div>
      </section>
    </nav>
    <main class="work">
      <div id="tabs" class="tabs" role="tablist" aria-label="Sessions ouvertes"></div>
      <div id="toolbar" class="toolbar"></div>
      <div class="content">
        <div id="views" class="views"></div>
        <aside id="details" class="details" aria-label="Détails de la session"></aside>
      </div>
    </main>
  </div>
  <footer id="status" class="statusbar"></footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
