[package]
name = "portunia-assistance"
version = "0.83.0"
description = "Portunia Assistance : programme de la personne aidée (assistance à distance)"

edition = "2021"

[features]
# Modes d'essai (serveur RDP direct, accord automatique, démonstration) : jamais dans la version publiée.
essai = []

[dependencies]
ironrdp-server = "0.13"
ironrdp-pdu = "0.9"
tracing = "0.1"
windows-numerics = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
anyhow = "1"
xcap = "0.9"
rcgen = "0.14"
bytes = "1"
async-trait = "0.1"
assist-proto = { path = "../assist-proto" }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Globalization", "Win32_System_SystemServices", "Win32_Storage_Xps", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Imaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
