[package]
name = "portunia-assistance"
version = "0.50.0"
description = "Portunia Assistance : programme de la personne aidée (assistance à distance)"

edition = "2021"

[dependencies]
ironrdp-server = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
anyhow = "1"
xcap = "0.9"
rcgen = "0.14"
bytes = "1"
async-trait = "0.1"
assist-proto = { path = "../assist-proto" }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Globalization", "Win32_System_SystemServices", "Win32_Storage_Xps"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
