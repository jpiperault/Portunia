[package]
name = "portunia-assist-android"
version = "0.63.0"
description = "Portunia Assistance pour Android : relais, code et écran (vue seule), appelé par l'appli Kotlin"
edition = "2021"

[lib]
name = "portunia_assist"
crate-type = ["cdylib"]

[dependencies]
ironrdp-server = "0.13"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util"] }
anyhow = "1"
rcgen = "0.14"
bytes = "1"
async-trait = "0.1"
assist-proto = { path = "../../assist-proto" }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
jni = "0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
