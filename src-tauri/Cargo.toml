[package]
name = "portunia"
version = "0.64.0"
description = "Gestionnaire de sessions distantes léger et extensible"
edition = "2021"

[lib]
name = "portunia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2", "des", "dsa"] }
tokio = { version = "1", features = ["sync", "macros", "time", "fs", "io-util", "net", "rt"] }
keyring = { version = "3", features = ["windows-native"] }
russh-sftp = "3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
winreg = "0.56.0"
quick-xml = "0.42.0"
serialport = { version = "4.10.1", default-features = false }
tauri-plugin-single-instance = "2"
vnc-rs = "0.6"
# Sans « zip » : Portunia publie un installateur .exe signé, jamais d'archive à extraire
# (la bibliothèque zip avait des failles d'extraction, RUSTSEC-2026-0367 à 0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
rand = { version = "0.10", features = ["thread_rng"] }
suppaftp = { version = "12.2.1", default-features = false, features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
assist-proto = { path = "../assist-proto" }

# Windows Hello (verrouillage de l'application).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security_Cryptography"] }
windows-future = "0.3"

# Exécutable le plus petit possible en release.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
