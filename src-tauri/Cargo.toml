[package]
name = "termoria"
version = "0.24.0"
description = "Gestionnaire de sessions distantes léger et extensible"
edition = "2021"

[lib]
name = "termoria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ring = "0.17"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2", "des", "dsa"] }
tokio = { version = "1", features = ["sync", "macros", "time", "fs", "io-util", "net", "rt"] }
keyring = { version = "3", features = ["windows-native"] }
russh-sftp = "3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
winreg = "0.56.0"
quick-xml = "0.42.0"
serialport = { version = "4.10.1", default-features = false }
tauri-plugin-single-instance = "2"
vnc-rs = "0.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
rand = { version = "0.10", features = ["thread_rng"] }

# Windows Hello (verrouillage de l'application).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_Foundation"] }
windows-future = "0.3"

# Exécutable le plus petit possible en release.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
