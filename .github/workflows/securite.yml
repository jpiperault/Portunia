# Vérifie chaque semaine (et à chaque envoi sur main) que les dépendances n'ont pas de
# faille connue : base RustSec pour Rust, npm audit pour l'interface.
name: Sécurité des dépendances

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - run: npm audit --omit=dev
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri
