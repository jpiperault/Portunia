# Vérifie que Portunia compile et que les tests passent sur macOS et Windows.
# Ne publie rien et n'utilise aucun secret : la publication relève de release.yml.
name: Build macOS

on:
  push:
    branches: ['feat/macos-**', main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri -> target
            rdp-helper -> target

      - run: npm ci
      # Moteur RDP universel (lipo), attendu par « externalBin » pour la cible universelle.
      - run: node scripts/build-rdp.mjs --release
        env:
          PORTUNIA_RDP_UNIVERSAL: '1'
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path rdp-helper/Cargo.toml
      - run: npm test
      - run: npm run build
      # Pas de clé de signature des mises à jour ici (aucun secret) : on n'en produit pas.
      - run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Vérifier l'architecture et la signature
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Portunia.app"
          test -d "$APP"
          ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          for bin in "$APP"/Contents/MacOS/*; do
            echo "$bin : $(lipo -archs "$bin")"
            test "$(lipo -archs "$bin" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          done
          codesign -v --verbose=2 "$APP"
          codesign -v --verbose=2 "$APP/Contents/MacOS/portunia-rdp"
          codesign -dv --verbose=2 "$APP/Contents/MacOS/portunia-rdp" 2>&1 | grep -E 'Signature|flags|Identifier'


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri -> target
            rdp-helper -> target

      - run: npm ci
      # Le script de build de src-tauri exige le moteur RDP (externalBin) avant de compiler.
      - run: node scripts/build-rdp.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path rdp-helper/Cargo.toml
      - run: npm test
      - run: npm run build
