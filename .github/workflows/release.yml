# Publie une version de Termoria : à chaque tag vX.Y.Z poussé sur GitHub,
# compile l'installateur Windows, le signe pour les mises à jour automatiques
# et crée la release dans le dépôt PUBLIC jpiperault/termoria-releases
# (le code reste privé ici ; Termoria y lit latest.json pour se mettre à jour).
#
# Secrets à définir dans ce dépôt (Settings > Secrets and variables > Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           contenu du fichier termoria.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe choisi à sa création
#   RELEASES_TOKEN                      jeton d'accès (fine-grained) avec le droit
#                                       « Contents : Read and write » sur termoria-releases
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            rdp-helper -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # Jeton autorisé à publier dans le dépôt public des versions.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: jpiperault
          repo: termoria-releases
          # Le dépôt public ne contient pas ce code : le tag y est créé sur sa branche main.
          commitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Termoria ${{ github.ref_name }}
          releaseBody: Installez Termoria avec le fichier « setup.exe » ci-dessous. Les versions suivantes s'installent ensuite automatiquement depuis l'application.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
