# Publie une version de Portunia : à chaque tag vX.Y.Z poussé sur GitHub,
# compile l'installateur Windows, le signe pour les mises à jour automatiques
# et crée la release dans le dépôt PUBLIC jpiperault/Portunia-releases
# (le code reste privé ici ; Portunia y lit latest.json pour se mettre à jour).
# Une copie de la release, avec la liste des changements, est aussi créée dans ce dépôt.
#
# Secrets à définir dans ce dépôt (Settings > Secrets and variables > Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           contenu du fichier ~/.tauri/termoria.key (nom d'origine, gardé)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe choisi à sa création
#   RELEASES_TOKEN                      jeton d'accès (fine-grained) avec le droit
#                                       « Contents : Read and write » sur portunia-releases
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release copiée dans ce dépôt

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri -> target
            rdp-helper -> target
            aide -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Jeton autorisé à publier dans le dépôt public des versions.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: jpiperault
          repo: Portunia-releases
          # Le dépôt public ne contient pas ce code : le tag y est créé sur sa branche main.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Portunia ${{ github.ref_name }}
          releaseBody: "Install Portunia with the « setup.exe » file below; later versions then install automatically from the app. — Installez Portunia avec le fichier « setup.exe » ci-dessous ; les versions suivantes s'installent ensuite automatiquement depuis l'application."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Portunia Assistance (programme de la personne aidée) : les Gates le téléchargent
      # depuis « latest/download » du dépôt public, avec son empreinte SHA-256 pour le vérifier.
      - name: Portunia Assistance
        shell: bash
        # Runtime C intégré : le programme se lance sur un PC sans le « Visual C++ Redistributable ».
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --manifest-path aide/Cargo.toml
          if grep -a -q -i "vcruntime140.dll" aide/target/release/portunia-assistance.exe; then echo "portunia-assistance.exe dépend encore de vcruntime140.dll"; exit 1; fi
          mkdir -p assist
          # Les modes d'essai (fonctionnalité « essai ») ne doivent jamais être publiés.
          if grep -a -q -e "--accord-auto" -e "--ecoute" aide/target/release/portunia-assistance.exe; then echo "Modes d'essai présents dans portunia-assistance.exe"; exit 1; fi
          cp aide/target/release/portunia-assistance.exe assist/
          (cd assist && sha256sum portunia-assistance.exe | cut -d' ' -f1 > portunia-assistance.exe.sha256)

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: jpiperault/Portunia-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            assist/portunia-assistance.exe
            assist/portunia-assistance.exe.sha256

      # Copie dans ce dépôt privé, avec la liste des changements depuis la version précédente.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Portunia ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*
            assist/*

  # Mac universel (Intel + Apple Silicon), signé ad-hoc : pas de compte Apple Developer, donc pas
  # de notarisation (Gatekeeper demande « Ouvrir quand même » à la première installation).
  # Après la tâche Windows : tauri-action fusionne darwin-aarch64 et darwin-x86_64 dans le
  # latest.json que Windows vient de créer ; en parallèle, les deux tâches se marcheraient dessus.
  #
  # Notarisation (désactivée) : pour l'activer, définir ces secrets dans le dépôt ; l'étape
  # « Publier (notarisée) » remplace alors l'étape ad-hoc.
  #   APPLE_CERTIFICATE           certificat « Developer ID Application » (.p12) encodé en base64
  #   APPLE_CERTIFICATE_PASSWORD  mot de passe du .p12
  #   APPLE_SIGNING_IDENTITY      par ex. « Developer ID Application: Nom (TEAMID) »
  #   APPLE_ID                    identifiant Apple du compte développeur
  #   APPLE_PASSWORD              mot de passe d'application (appleid.apple.com)
  #   APPLE_TEAM_ID               identifiant d'équipe
  macos:
    needs: windows
    runs-on: macos-latest
    env:
      # Un secret ne se teste pas directement dans « if: » : on passe par cette variable.
      NOTARIZE: ${{ secrets.APPLE_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri -> target
            rdp-helper -> target

      - run: npm ci

      # Moteur RDP universel (lipo des deux architectures), attendu par « externalBin ».
      - run: node scripts/build-rdp.mjs --release
        env:
          PORTUNIA_RDP_UNIVERSAL: '1'

      - name: Publier (signature ad-hoc)
        if: ${{ env.NOTARIZE != 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: jpiperault
          repo: Portunia-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Portunia ${{ github.ref_name }}
          releaseBody: "Install Portunia with the « setup.exe » file below; later versions then install automatically from the app. — Installez Portunia avec le fichier « setup.exe » ci-dessous ; les versions suivantes s'installent ensuite automatiquement depuis l'application."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: Publier (notarisée)
        if: ${{ env.NOTARIZE == 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: jpiperault
          repo: Portunia-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Portunia ${{ github.ref_name }}
          releaseBody: "Install Portunia with the « setup.exe » file below; later versions then install automatically from the app. — Installez Portunia avec le fichier « setup.exe » ci-dessous ; les versions suivantes s'installent ensuite automatiquement depuis l'application."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      # Dernier garde-fou : le latest.json publié doit contenir les trois plateformes,
      # chacune avec la bonne archive (jamais l'artefact d'une autre plateforme).
      - name: Vérifier latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo jpiperault/Portunia-releases --pattern latest.json --clobber
          node scripts/check-latest-json.mjs latest.json --tag "$TAG"
