[package]
name = "termoria-rdp"
version = "0.1.0"
description = "Moteur RDP de Termoria (IronRDP), lancé par l'application pour chaque session"
edition = "2021"

# Programme séparé : les dépendances d'IronRDP (versions préliminaires de
# bibliothèques cryptographiques) sont incompatibles avec celles de russh.

[dependencies]
ironrdp-client = { version = "0.1", features = ["native-tls"] }
ironrdp-pdu = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
smallvec = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
