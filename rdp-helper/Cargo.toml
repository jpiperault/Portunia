[package]
name = "portunia-rdp"
version = "0.1.0"
description = "Moteur RDP de Portunia (IronRDP), lanc?? par l'application pour chaque session"
edition = "2021"

# Programme s??par?? : les d??pendances d'IronRDP (versions pr??liminaires de
# biblioth??ques cryptographiques) sont incompatibles avec celles de russh.

[dependencies]
ironrdp-client = { version = "0.1", features = ["native-tls", "clipboard", "sound", "gateway"] }
ironrdp-pdu = "0.9"
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-core = "0.2"
ironrdp-cliprdr = "0.7"
ironrdp-graphics = "0.9"
ironrdp-bulk = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
smallvec = "1"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ironrdp-client avec le choix des options d'affichage (réglage « Qualité ») : voir vendor/ironrdp-client/PORTUNIA.md.
[patch.crates-io]
ironrdp-client = { path = "vendor/ironrdp-client" }
