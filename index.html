<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portunia</title>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Sessions">
      <label class="search">
        <span class="sr-only">Rechercher une session</span>
        <input id="search" type="search" placeholder="Rechercher, ou ssh user@hôte…" title="Rechercher une session (Ctrl Maj K). Entrée sur « user@hôte », « rdp hôte »… : connexion rapide. Palette : Ctrl Maj O" autocomplete="off">
      </label>
      <div class="sidebar-head">
        <span class="label">Ce PC</span>
        <div class="head-actions">
          <button id="manage-shells" class="icon-btn" aria-label="Gérer les shells locaux" title="Gérer les shells locaux"></button>
        </div>
      </div>
      <div id="local-shells" class="local-shells"></div>
      <div class="sidebar-head">
        <span class="label">Sessions</span>
        <div class="head-actions">
          <button id="quick-connect" class="icon-btn" aria-label="Connexion rapide" title="Connexion rapide : adresse, identifiant et mot de passe (Ctrl Maj Q)"></button>
          <button id="new-folder" class="icon-btn" aria-label="Nouveau dossier" title="Nouveau dossier"></button>
          <button id="new-session" class="icon-btn" aria-label="Nouvelle session" title="Nouvelle session (Ctrl Maj N)"></button>
        </div>
      </div>
      <div id="tree" class="tree"></div>
      <div class="sidebar-foot">
        <button id="open-snippets" class="tree-item"></button>
        <button id="open-credentials" class="tree-item"></button>
        <button id="open-recordings" class="tree-item"></button>
        <button id="open-nettools" class="tree-item"></button>
        <button id="open-import" class="tree-item"></button>
        <button id="open-extensions" class="tree-item"></button>
        <button id="open-settings" class="tree-item"></button>
      </div>
    </nav>
    <main class="work">
      <div id="tabs" class="tabs" role="tablist" aria-label="Sessions ouvertes"></div>
      <div id="toolbar" class="toolbar"></div>
      <div class="content">
        <div id="views" class="views"></div>
        <aside id="details" class="details" aria-label="Détails de la session"></aside>
      </div>
    </main>
  </div>
  <footer id="status" class="statusbar"></footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
