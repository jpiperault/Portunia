# vsftpd du labo : FTP et FTPS explicite sur le même port.
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO

# Mode passif : ports publiés par docker-compose, adresse vue depuis le PC.
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1

# TLS : facultatif (pour tester aussi le FTP non chiffré), reprise de session exigée.
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=NO
force_local_logins_ssl=NO
ssl_tlsv1_2=YES
require_ssl_reuse=YES
rsa_cert_file=/etc/ssl/labo/ftp.pem
rsa_private_key_file=/etc/ssl/labo/ftp.key
