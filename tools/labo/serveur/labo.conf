# Réglages SSH du labo (tests de Termoria).
AddressFamily inet
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PubkeyAuthentication yes
AllowTcpForwarding yes
# Tunnels inverses : le port ouvert sur le serveur reste sur sa boucle locale.
GatewayPorts no
X11Forwarding yes
X11UseLocalhost yes
